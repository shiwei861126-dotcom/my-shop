<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="800" height="120" fill="url(#bg)"/>
  
  <!-- Logo 位置（40×40 圆形） -->
  <circle cx="380" cy="45" r="20" fill="white" opacity="0.3" stroke="#fff" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="380" y="49" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif" opacity="0.7">LOGO</text>
  <text x="380" y="28" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="sans-serif">40×40px 圆形</text>
  
  <!-- 店名 -->
  <text x="420" y="49" fill="white" font-size="28" font-family="sans-serif" font-weight="bold">RSD的格格屋</text>
  
  <!-- 副标题 -->
  <text x="400" y="80" text-anchor="middle" fill="#bfdbfe" font-size="15" font-family="sans-serif">精品屋，欢迎光临</text>
  
  <!-- 标注线 -->
  <line x1="358" y1="65" x2="358" y2="105" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="402" y1="65" x2="402" y2="105" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="380" y="114" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="sans-serif">Logo区域（40×40px，圆形裁剪）</text>
</svg>