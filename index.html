<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSD的格格屋</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <img src="/UI/header-1200x195.png?v=2" alt="RSD的格格屋" class="header-banner">
        </div>
    </header>

    <main class="container">
        <!-- 商品列表 -->
        <section id="products-section">
            <h2>全部商品</h2>
            <div id="product-grid" class="product-grid">
                <!-- 由 JS 动态渲染 -->
            </div>
        </section>

        <!-- 商品详情 & 下单 -->
                <section id="order-section" class="hidden">
            <div class="order-container">
                <button id="back-btn" class="back-btn">&larr; 返回商品列表</button>
                <div id="order-product-info">
                    <!-- 商品详情由 JS 填充 -->
                </div>
                <div id="order-product-gallery" class="product-gallery">
                    <!-- 多图轮播由 JS 渲染 -->
                </div>
                <div id="order-spec" class="spec-selector">
                    <!-- 规格选择由 JS 渲染 -->
                </div>
                <div class="order-form">
                    <h3>收货信息</h3>
                    <div class="form-group">
                        <label>数量</label>
                        <input type="number" id="order-qty" value="1" min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label>收货人姓名 <span class="required">*</span></label>
                        <input type="text" id="order-name" placeholder="请填写收货人姓名">
                    </div>
                    <div class="form-group">
                        <label>手机号 <span class="required">*</span></label>
                        <input type="tel" id="order-phone" placeholder="请填写手机号">
                    </div>
                    <div class="form-group">
                        <label>收货地址 <span class="required">*</span></label>
                        <textarea id="order-address" rows="3" placeholder="省/市/区/详细地址"></textarea>
                    </div>
                    <div class="form-group">
                        <label>备注（可选）</label>
                        <textarea id="order-note" rows="2" placeholder="其他需要说明的内容"></textarea>
                    </div>
                </div>

                <!-- 支付区 -->
                <div class="payment-section">
                    <h3>支付</h3>
                    <div class="payment-qr-area">
                        <p class="payment-amount-label">需支付金额：<strong id="pay-amount-display">&yen;0.00</strong></p>
                        <div class="payment-qrcode" id="payment-qrcode">
                            <img src="qrcodes/支付宝支付码.jpg" alt="支付宝收款码" id="pay-qr-img">
                        </div>
                        <p class="payment-tip">请使用支付宝扫描上方二维码完成支付</p>
                    </div>
                    <div class="form-group">
                        <label>上传支付凭证（截图）<span class="required">*</span></label>
                        <div class="file-upload-area">
                            <input type="file" id="pay-voucher" accept="image/*" capture="environment">
                            <label for="pay-voucher" class="file-upload-label">
                                <span class="upload-icon">&#x1F4F7;</span>
                                <span>点击选择支付截图</span>
                            </label>
                            <div id="voucher-preview" class="voucher-preview hidden">
                                <img id="voucher-img" src="" alt="支付凭证预览">
                                <button type="button" id="remove-voucher" class="remove-voucher">&times;</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="order-submit-area">
                    <div class="order-total">
                        <span>合计：</span>
                        <span id="order-total-price" class="total-price">&yen;0.00</span>
                    </div>
                    <button id="submit-order-btn" class="btn-primary">提交订单</button>
                </div>
            </div>
        </section>

        <!-- 成功弹窗 -->
        <div id="success-modal" class="modal hidden">
            <div class="modal-content success-content">
                <div class="success-icon">&#x2705;</div>
                <h2>订单提交成功！</h2>
                <div class="success-order-info">
                    <p>您的订单编号为：</p>
                    <p class="order-id-display" id="order-id-display">ORD000000000000</p>
                    <p class="success-tip">请保留此订单号，后续人工确认收款时将使用此编号</p>
                </div>
                <button id="continue-shopping-btn" class="btn-primary">继续购物</button>
            </div>
        </div>

        <!-- 成功弹窗 -->
        <div id="success-modal" class="modal hidden">
            <div class="modal-content success-content">
                <div class="success-icon">&#x2705;</div>
                <h2>订单提交成功！</h2>
                <div class="success-order-info">
                    <p>您的订单编号为：</p>
                    <p class="order-id-display" id="order-id-display">ORD000000000000</p>
                    <p class="success-tip">请保留此订单号，后续人工确认收款时将使用此编号</p>
                </div>
                <button id="continue-shopping-btn" class="btn-primary">继续购物</button>
            </div>
        </div>

        <!-- 支付弹窗 -->
        <div id="payment-modal" class="modal hidden">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>扫码支付</h2>
                <p class="payment-amount">需支付：<strong id="pay-amount">¥0.00</strong></p>
                <div class="qrcode-container" id="qrcode-container">
                    <!-- 二维码图片由 JS 渲染 -->
                </div>
                <p class="payment-hint">请使用微信/支付宝扫描上方二维码完成支付</p>
                <p class="payment-hint small">支付完成后，下方填写地址信息即可提交订单</p>
                <div class="payment-form">
                    <div class="form-group">
                        <label>收货人姓名 <span class="required">*</span></label>
                        <input type="text" id="pay-name" placeholder="请填写收货人姓名">
                    </div>
                    <div class="form-group">
                        <label>手机号 <span class="required">*</span></label>
                        <input type="tel" id="pay-phone" placeholder="请填写手机号">
                    </div>
                    <div class="form-group">
                        <label>收货地址 <span class="required">*</span></label>
                        <textarea id="pay-address" rows="3" placeholder="省/市/区/详细地址"></textarea>
                    </div>
                    <div class="form-group">
                        <label>备注（可选）</label>
                        <textarea id="pay-note" rows="2" placeholder="其他需要说明的内容"></textarea>
                    </div>
                    <button id="confirm-pay-btn" class="btn-primary">我已支付，提交订单</button>
                </div>
            </div>
        </div>

        <!-- 成功弹窗 -->
        <div id="success-modal" class="modal hidden">
            <div class="modal-content success-content">
                <div class="success-icon">✅</div>
                <h2>订单提交成功！</h2>
                <p>我们会尽快处理您的订单。</p>
                <button id="continue-shopping-btn" class="btn-primary">继续购物</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 RSD的格格屋</p>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
