<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 我的小店</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container { max-width: 900px; margin: 32px auto; padding: 0 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .admin-header h2 { margin: 0; }
        .admin-header a { color: var(--primary); text-decoration: none; font-size: 14px; }
        .admin-header a:hover { text-decoration: underline; }

        .order-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 16px;
        }
        .order-card .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .order-card .order-id { font-weight: 600; font-size: 14px; color: var(--text-light); }
        .order-card .order-time { font-size: 13px; color: var(--text-light); }
        .order-card .order-body { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .order-card .field { }
        .order-card .field-label { font-size: 12px; color: var(--text-light); margin-bottom: 2px; }
        .order-card .field-value { font-size: 14px; }
        .order-card .field-value.highlight { color: var(--danger); font-weight: 700; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>📋 订单管理</h1>
            <p class="subtitle">查看所有收到的订单</p>
        </div>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h2>订单列表</h2>
            <a href="index.html">← 返回商店首页</a>
        </div>
        <div id="order-list"></div>
    </div>

    <script>
        function renderOrders() {
            const container = document.getElementById('order-list');
            let orders;
            try {
                orders = JSON.parse(localStorage.getItem('shop_orders') || '[]');
            } catch (e) {
                orders = [];
            }

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>暂无订单</h3>
                        <p>还没有收到任何订单</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-id">📦 ${order.orderId}</span>
                        <span class="order-time">${new Date(order.createdAt).toLocaleString('zh-CN')}</span>
                    </div>
                    <div class="order-body">
                        <div class="field">
                            <div class="field-label">商品</div>
                            <div class="field-value">${order.productName} x ${order.quantity}</div>
                        </div>
                        <div class="field">
                            <div class="field-label">金额</div>
                            <div class="field-value highlight">¥${order.total.toFixed(2)}</div>
                        </div>
                        <div class="field" style="grid-column:1/-1;">
                            <div class="field-label">收货人</div>
                            <div class="field-value">${order.customer.name}　${order.customer.phone}</div>
                        </div>
                        <div class="field" style="grid-column:1/-1;">
                            <div class="field-label">收货地址</div>
                            <div class="field-value">${order.customer.address}</div>
                        </div>
                        ${order.customer.note ? `
                        <div class="field" style="grid-column:1/-1;">
                            <div class="field-label">备注</div>
                            <div class="field-value">${order.customer.note}</div>
                        </div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderOrders);
    </script>
</body>
</html>
